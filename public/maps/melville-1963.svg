<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#d9cfc0"/>
  <rect x="90" y="70" width="620" height="430" fill="#f1e8da" stroke="#6e5f4b" stroke-width="4"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#1a1a1a">Melville Memory · 1963</text>
  <text x="400" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5c6570">Tap the red dots — Card Catalog · Modular Plan · Seal</text>

  <!-- left: catalog bays -->
  <rect x="120" y="120" width="240" height="280" fill="#e8dcc8" stroke="#6e5f4b" stroke-width="2"/>
  <g stroke="#6e5f4b" stroke-width="2">
    <path d="M140 160 H340"/>
    <path d="M140 200 H340"/>
    <path d="M140 240 H340"/>
    <path d="M140 280 H340"/>
    <path d="M140 320 H340"/>
  </g>
  <text x="240" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a3f32">Card Catalog</text>

  <!-- right: modular bays -->
  <rect x="420" y="120" width="250" height="160" fill="#e2d5c0" stroke="#6e5f4b" stroke-width="2"/>
  <rect x="420" y="300" width="120" height="100" fill="#e2d5c0" stroke="#6e5f4b" stroke-width="2"/>
  <rect x="550" y="300" width="120" height="100" fill="#e2d5c0" stroke="#6e5f4b" stroke-width="2"/>
  <text x="545" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a3f32">Modular Bays</text>

  <!-- seal zone -->
  <circle cx="400" cy="470" r="28" fill="none" stroke="#990000" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#990000">Seal the Echo</text>
</svg>
